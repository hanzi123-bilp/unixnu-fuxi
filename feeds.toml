# Extra sources this device repository needs on top of UniXNU's own feeds.toml.
#
# audit-storage-interface.py reads refer/IOStorageFamily to build
# build/storage-abi/{interface-audit.json,include/IOKit/storage/...}, which
# build-arm-driver.py NativeUfs and build-native-virtio-bindings.py both need.
# UniXNU's feeds.toml does not declare it, so `unixnu fetch` never creates that
# tree and the archive step dies with:
#     fatal: cannot change to '.../tree/refer/IOStorageFamily'
#
# Tag picked as the newest IOStorageFamily release; the audit only needs the
# IOBlockStorageDevice interface description, not an exact Darwin 23 match.

[[source]]
name = "IOStorageFamily"
kind = "refer"
git = "https://github.com/apple-oss-distributions/IOStorageFamily.git"
ref = "IOStorageFamily-337.100.1"
commit = "7edb88fbae296fb7c8ce2f64e115e116e566d51c"
